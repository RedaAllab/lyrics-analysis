# "Session sheet" theme. Colours mirror beatles_viz/config.py (INK, PAPER, CARD, MUTED, RULE): change both together.
[theme]
base = "light"
primaryColor = "#16161a"
backgroundColor = "#f4f4f1"
secondaryBackgroundColor = "#ffffff"
textColor = "#16161a"
linkColor = "#16161a"
linkUnderline = true
borderColor = "#16161a"
dataframeBorderColor = "#dadad4"
dataframeHeaderBackgroundColor = "#16161a"
dataframeHeaderTextColor = "#f4f4f1"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "none"
buttonRadius = "none"
font = "IBM Plex Sans, sans-serif"
headingFont = "Space Grotesk, sans-serif"
codeFont = "IBM Plex Mono, monospace"
headingFontWeights = [700, 700, 700, 600, 600, 600]
headingFontSizes = ["4rem", "2.25rem", "1.75rem", "1.375rem", "1.25rem", "1rem"]
metricValueFontSize = "2.25rem"
metricValueFontWeight = 700
codeBackgroundColor = "#ecece7"
redColor = "#c8283f"
orangeColor = "#e4572e"
yellowColor = "#a86a00"
blueColor = "#2b59c3"
greenColor = "#00796b"
violetColor = "#6a4fa3"
grayColor = "#5c5c66"
chartCategoricalColors = ["#2b59c3", "#c8283f", "#a86a00", "#00796b", "#6a4fa3", "#e4572e", "#4f6d8a", "#6e6e73"]
chartSequentialColors = ["#ecece7", "#d3d8e6", "#b7c2df", "#9aabd7", "#7d95d0", "#607fc9", "#456ac2", "#2b59c3", "#1f4596", "#16161a"]

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-var.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-var.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-latin-var.woff2"
weight = 600

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/SpaceGrotesk-latin-var.woff2"
weight = 500

[[theme.fontFaces]]
family = "Space Grotesk"
url = "app/static/fonts/SpaceGrotesk-latin-var.woff2"
weight = 700

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-400-latin.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "app/static/fonts/IBMPlexMono-500-latin.woff2"
weight = 500

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f4f1"
borderColor = "#16161a"

[server]
enableStaticServing = true

[browser]
gatherUsageStats = false
