<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 190" role="img" aria-label="Stadium floodlights, drum kit, amplifier and violin bass above a zebra crossing">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f1"/><stop offset="1" stop-color="#f4f4f1"/>
    </linearGradient>
    <pattern id="diamonds" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="10" fill="#ecece7"/><path d="M0 0H10M0 0V10" stroke="#16161a" stroke-width="1.4"/>
    </pattern>
  </defs>
  <rect width="960" height="190" fill="url(#sky)"/>

  <!-- stadium from outside: round drum facade, ramp levels, blue and orange panels, floodlights on the roof -->
  <path d="M20 150 L20 56 Q170 22 320 56 L320 150Z" fill="#ffffff"/>
  <g fill="none" stroke="#16161a" stroke-width="2.5" stroke-opacity=".75"><path d="M20 68 Q170 34 320 68"/><path d="M20 84 Q170 50 320 84"/><path d="M20 100 Q170 66 320 100"/><path d="M20 116 Q170 82 320 116"/><path d="M20 132 Q170 98 320 132"/></g>
  <rect x="34" y="67" width="16" height="59" fill="#2b59c3"/><rect x="68" y="62" width="16" height="64" fill="#e4572e"/><rect x="102" y="58" width="16" height="68" fill="#2b59c3"/><rect x="136" y="56" width="16" height="70" fill="#e4572e"/><rect x="170" y="55" width="16" height="71" fill="#2b59c3"/><rect x="204" y="56" width="16" height="70" fill="#e4572e"/><rect x="238" y="59" width="16" height="67" fill="#2b59c3"/><rect x="272" y="64" width="16" height="62" fill="#e4572e"/><rect x="306" y="71" width="16" height="55" fill="#2b59c3"/>
  <rect x="60" y="138" width="14" height="12" fill="#16161a"/><rect x="120" y="138" width="14" height="12" fill="#16161a"/><rect x="180" y="138" width="14" height="12" fill="#16161a"/><rect x="240" y="138" width="14" height="12" fill="#16161a"/>
  <path d="M20 56 Q170 22 320 56" fill="none" stroke="#16161a" stroke-width="4"/>
  <path d="M20 56V150M320 56V150" stroke="#16161a" stroke-width="2"/>
  <g stroke="#16161a" stroke-width="2"><path d="M70 44V24M270 44V24"/></g>
  <g fill="#16161a"><rect x="56" y="8" width="28" height="16" rx="1"/><rect x="256" y="8" width="28" height="16" rx="1"/></g>
  <g fill="#f4f4f1">
    <circle cx="63" cy="13" r="1.8"/><circle cx="70" cy="13" r="1.8"/><circle cx="77" cy="13" r="1.8"/>
    <circle cx="63" cy="19" r="1.8"/><circle cx="70" cy="19" r="1.8"/><circle cx="77" cy="19" r="1.8"/>
    <circle cx="263" cy="13" r="1.8"/><circle cx="270" cy="13" r="1.8"/><circle cx="277" cy="13" r="1.8"/>
    <circle cx="263" cy="19" r="1.8"/><circle cx="270" cy="19" r="1.8"/><circle cx="277" cy="19" r="1.8"/>
  </g>
  <path d="M70 8 L40 -20M70 8 L100 -20M270 8 L240 -20M270 8 L300 -20" stroke="#16161a" stroke-opacity=".1" stroke-width="14" stroke-linecap="round"/>

  <!-- drum kit, front view: hi-hat, snare, bass drum with rack tom, floor tom, crash -->
  <g stroke="#16161a" stroke-width="2" fill="none">
    <path d="M356 150V74M346 150l10-14 10 14"/>
    <path d="M397 120V138M385 150l12-12 12 12"/>
    <path d="M540 150V56M530 150l10-14 10 14M540 56l-14-4"/>
    <path d="M498 140l-6 10M524 140l6 10"/>
    <path d="M424 142l-8 8M476 142l8 8"/>
  </g>
  <g fill="#e9c46a">
    <ellipse cx="356" cy="72" rx="19" ry="3"/><ellipse cx="356" cy="77" rx="19" ry="3"/>
    <ellipse cx="520" cy="50" rx="24" ry="4.5" transform="rotate(-10 520 50)"/>
  </g>
  <g stroke="#16161a" stroke-width="2">
    <rect x="380" y="104" width="34" height="16" fill="#ffffff"/><ellipse cx="397" cy="104" rx="17" ry="4" fill="#ecece7"/>
    <path d="M450 88V94"/>
    <rect x="432" y="70" width="36" height="20" fill="#ffffff"/><ellipse cx="450" cy="70" rx="18" ry="5" fill="#16161a"/>
    <rect x="492" y="96" width="38" height="44" fill="#ffffff"/><ellipse cx="511" cy="96" rx="19" ry="5" fill="#ecece7"/>
    <path d="M492 104h38M492 132h38" stroke-opacity=".5"/>
    <circle cx="450" cy="120" r="30" fill="#ecece7" stroke="#ffffff" stroke-width="6"/>
    <circle cx="450" cy="120" r="33" fill="none"/>
  </g>
  <circle cx="450" cy="120" r="9" fill="none" stroke="#f4f4f1" stroke-opacity=".25" stroke-width="2"/>

  <!-- amplifier with diamond grille -->
  <g>
    <rect x="570" y="62" width="112" height="88" rx="5" fill="#ffffff" stroke="#16161a" stroke-width="3"/>
    <rect x="570" y="62" width="112" height="22" rx="5" fill="#ecece7"/>
    <g fill="#16161a"><circle cx="590" cy="73" r="4"/><circle cx="608" cy="73" r="4"/><circle cx="626" cy="73" r="4"/></g>
    <rect x="644" y="68" width="28" height="10" rx="2" fill="#e4572e"/>
    <rect x="580" y="92" width="92" height="50" fill="url(#diamonds)" stroke="#16161a" stroke-width="1.5"/>
    <path d="M610 62V54h32v8" fill="none" stroke="#16161a" stroke-width="3"/>
  </g>

  <!-- violin bass on a stand: sunburst violin body, pearl pickguard, two pickups near the neck, long neck, 2+2 head -->
  <radialGradient id="burst" cx=".5" cy=".55" r=".6">
    <stop offset="0" stop-color="#e3a24a"/><stop offset=".6" stop-color="#a5521f"/><stop offset="1" stop-color="#3a1a0c"/>
  </radialGradient>
  <path d="M782 150l12-22 12 22M794 128v-6" stroke="#16161a" stroke-width="2" fill="none"/>
  <g transform="translate(800 140) rotate(-12)">
    <rect x="-3" y="-122" width="6" height="66" fill="#3a2418" stroke="#16161a" stroke-width="1.5"/>
    <rect x="-6" y="-143" width="12" height="22" rx="3" fill="#2b1a12" stroke="#16161a" stroke-width="1.5"/>
    <g fill="#16161a"><circle cx="-9" cy="-138" r="2"/><circle cx="-9" cy="-128" r="2"/><circle cx="9" cy="-138" r="2"/><circle cx="9" cy="-128" r="2"/></g>
    <path d="M0 0 C14 0 24 -4 23 -16 C22 -26 13 -26 13 -32 C13 -37 19 -40 18 -48 C17 -56 8 -58 0 -58 C-8 -58 -17 -56 -18 -48 C-19 -40 -13 -37 -13 -32 C-13 -26 -22 -26 -23 -16 C-24 -4 -14 0 0 0Z"
          fill="url(#burst)" stroke="#16161a" stroke-width="2"/>
    <path d="M3 -54 C12 -54 17 -46 14 -38 C12 -32 8 -30 5 -32Z" fill="#efe6d2" fill-opacity=".85"/>
    <g fill="#f4f4f1" stroke="#16161a" stroke-width="1"><rect x="-8" y="-52" width="16" height="4" rx="1"/><rect x="-8" y="-45" width="16" height="4" rx="1"/></g>
    <rect x="-7" y="-24" width="14" height="2.5" fill="#16161a"/>
    <path d="M-5 -22L-2 -3H2L5 -22" fill="none" stroke="#16161a" stroke-width="1.5"/>
    <path d="M-1.5 -140V-22M1.5 -140V-22" stroke="#16161a" stroke-opacity=".6" stroke-width=".7"/>
  </g>

  <!-- union flag (simplified) -->
  <g transform="translate(880 14)">
    <rect width="64" height="38" fill="#2b59c3"/>
    <path d="M0 0L64 38M64 0L0 38" stroke="#ffffff" stroke-width="7"/><path d="M0 0L64 38M64 0L0 38" stroke="#c8283f" stroke-width="2.5"/>
    <path d="M32 0V38M0 19H64" stroke="#ffffff" stroke-width="12"/><path d="M32 0V38M0 19H64" stroke="#c8283f" stroke-width="7"/>
  </g>

  <!-- zebra crossing -->
  <rect y="150" width="960" height="40" fill="#16161a"/>
  <g fill="#f4f4f1">
    <path id="s" d="M0 150H34L24 190H-12Z"/>
    <use href="#s" x="60"/><use href="#s" x="120"/><use href="#s" x="180"/><use href="#s" x="240"/><use href="#s" x="300"/>
    <use href="#s" x="360"/><use href="#s" x="420"/><use href="#s" x="480"/><use href="#s" x="540"/><use href="#s" x="600"/>
    <use href="#s" x="660"/><use href="#s" x="720"/><use href="#s" x="780"/><use href="#s" x="840"/><use href="#s" x="900"/>
    <use href="#s" x="960"/>
  </g>
</svg>
